# This file stores the flash_commands for each mcus
# Previous version KCONFIG_CONFIG was needed now it is automaticly added when make flash is called
# version : 0.1
# tested/supported flash methods :
#  - make flash
#  - sdcard_flash
#  - flashtool.py
#  - mount/cp/umount (for rp2040)
 
[rpi]
action_command: make flash

[octopus]
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32f446xx_19003900165053424E363620-if00
#action_command: ~/klipper/scripts/flash-sdcard.sh /dev/ttyAMA0 btt-octopus-f446-v1

[ebb]
#quiet_command: python3 ~/katapult/scripts/flashtool.py -i can0 -r -u b174431a9eb0
#quiet_command: sleep 2
#action_command: python3 ~/katapult/scripts/flashtool.py -can0 -u b174431a9eb0
action_command: python3 ~/katapult/scripts/flash_can.py -i can0 -f ~/klipper/out/klipper.bin -u b174431a9eb0

